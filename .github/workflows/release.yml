name: Draft and Publish Release

on:
  push:
    tags:
      - 'v*.*.*'  # v1.0.0, v2.1.3 등 v로 시작하는 태그가 push될 때 실행

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 릴리즈를 생성하고 파일을 업로드하려면 쓰기 권한이 필요합니다.

    steps:
      # 1. 소스코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. (예시) 파이썬 빌드 환경 세팅 - 사용 중인 언어나 환경에 맞춰 변경하세요.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. (예시) 실행 파일 빌드 - PyInstaller 등을 사용하여 바이너리 생성
      - name: Install dependencies & Build
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # main.py를 executable로 빌드 (dist/myapp 생성)
          pyinstaller --onefile --name myapp main.py

      # 4. GitHub Release 생성 및 빌드 결과물 업로드
      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/myapp  # 업로드할 실행 파일 경로 (.exe 또는 바이너리)
          generate_release_notes: true  # 이전 릴리즈 이후 커밋/PR 내역으로 노트 자동 생성
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
